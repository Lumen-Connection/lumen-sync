name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            task: packageReleaseMsi
            extension: msi
          - os: ubuntu-latest
            task: packageReleaseDeb
            extension: deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build installer
        run: ./gradlew :composeApp:${{ matrix.task }}
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.extension }}
          path: composeApp/build/compose/binaries/**/*.${{ matrix.extension }}
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK and NDK
        run: yes | sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || (echo "ANDROID_KEYSTORE_BASE64 is not configured" && exit 1)
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/lumen-sync-release.jks"
      - name: Build signed APK
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
          LUMEN_SYNC_KEYSTORE: ${{ runner.temp }}/lumen-sync-release.jks
          LUMEN_SYNC_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          LUMEN_SYNC_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          LUMEN_SYNC_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :composeApp:assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: composeApp/build/outputs/apk/release/*.apk
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [desktop, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" artifacts/**/* --generate-notes --verify-tag
