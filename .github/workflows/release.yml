name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-version:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6

      - name: Validate application version
        shell: bash
        run: |
          version_name="$(
            sed -n 's/^versionName=//p' version.properties |
            tr -d '\r'
          )"

          version_code="$(
            sed -n 's/^versionCode=//p' version.properties |
            tr -d '\r'
          )"

          if [[ ! "$version_name" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid versionName: $version_name"
            exit 1
          fi

          if [[ ! "$version_code" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::versionCode must be a positive integer"
            exit 1
          fi

          if [[ "$GITHUB_REF_TYPE" == "tag" ]] &&
             [[ "$GITHUB_REF_NAME" != "v$version_name" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version v$version_name"
            exit 1
          fi

          echo "Validated application version $version_name ($version_code)"
  desktop:
    needs: validate-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            task: packageReleaseMsi
            extension: msi
          - os: ubuntu-24.04
            task: packageReleaseDeb
            extension: deb

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.0"
          cache: false

      - uses: gradle/actions/setup-gradle@v6

      - name: Build installer
        run: ./gradlew :composeApp:${{ matrix.task }}

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.extension }}
          path: composeApp/build/compose/binaries/**/*.${{ matrix.extension }}
          if-no-files-found: error
          retention-days: 7

  android:
    needs: validate-version
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.0"
          cache: false

      - uses: gradle/actions/setup-gradle@v6

      - name: Install Android SDK and NDK
        shell: bash
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358"

          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Decode release keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for variable in \
            KEYSTORE_BASE64 \
            KEYSTORE_PASSWORD \
            KEY_ALIAS \
            KEY_PASSWORD
          do
            if [[ -z "${!variable}" ]]; then
              echo "::error::$variable is not configured"
              exit 1
            fi
          done

          printf '%s' "$KEYSTORE_BASE64" \
            | base64 --decode \
            > "$RUNNER_TEMP/lumen-sync-release.jks"

      - name: Build signed APK
        env:
          LUMEN_SYNC_KEYSTORE: ${{ runner.temp }}/lumen-sync-release.jks
          LUMEN_SYNC_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          LUMEN_SYNC_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          LUMEN_SYNC_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :composeApp:assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: composeApp/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - desktop
      - android

    runs-on: ubuntu-24.04

    permissions:
      contents: write

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Collect and checksum release assets
        shell: bash
        run: |
          mkdir release-assets

          mapfile -d '' asset_files < <(
            find artifacts -type f \
              \( -name '*.msi' -o -name '*.deb' -o -name '*.apk' \) \
              -print0
          )

          if [[ "${#asset_files[@]}" -ne 3 ]]; then
            echo "::error::Expected exactly 3 release assets, found ${#asset_files[@]}"
            find artifacts -type f -print
            exit 1
          fi

          for asset in "${asset_files[@]}"; do
            filename="$(basename "$asset")"

            if [[ -e "release-assets/$filename" ]]; then
              echo "::error::Duplicate release asset name: $filename"
              exit 1
            fi

            cp "$asset" "release-assets/$filename"
          done

          cd release-assets
          sha256sum -- *.msi *.deb *.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            release-assets/* \
            --title "Lumen Sync ${{ github.ref_name }}" \
            --generate-notes \
            --verify-tag
