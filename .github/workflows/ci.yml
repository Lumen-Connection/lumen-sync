name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android compile SDK
        run: yes | sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Compile both targets and run unit tests
        run: ./gradlew :composeApp:desktopTest :composeApp:compileDebugKotlinAndroid

  desktop-core:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build pinned desktop core
        run: ./gradlew :composeApp:buildSyncthingDesktop
      - name: Exercise two-device synchronization
        shell: pwsh
        run: ./tools/integration_smoke.ps1

  android-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android NDK
        run: yes | sdkmanager "ndk;28.2.13676358"
      - name: Build pinned Android arm64 core
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
        run: ./gradlew :composeApp:buildSyncthingAndroid
      - name: Inspect native artifact
        run: file composeApp/src/androidMain/jniLibs/arm64-v8a/libsyncthing.so
