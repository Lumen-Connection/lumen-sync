name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      - name: Install Android compile SDK
        shell: bash
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Compile both targets and run unit tests
        run: ./gradlew :composeApp:desktopTest :composeApp:compileDebugKotlinAndroid

  desktop-core:
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-24.04

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.0"
          cache: false

      - uses: gradle/actions/setup-gradle@v6

      - name: Build pinned desktop core
        run: ./gradlew :composeApp:buildSyncthingDesktop

      - name: Exercise two-device synchronization
        shell: pwsh
        run: ./tools/integration_smoke.ps1

  android-core:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.0"
          cache: false

      - uses: gradle/actions/setup-gradle@v6

      - name: Install and select Android NDK
        shell: bash
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "ndk;28.2.13676358"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Build pinned Android arm64 core
        run: ./gradlew :composeApp:buildSyncthingAndroid

      - name: Inspect native artifact
        run: file composeApp/src/androidMain/jniLibs/arm64-v8a/libsyncthing.so